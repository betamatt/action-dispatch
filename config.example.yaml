github:
  app_id: 12345
  installation_id: 67890
  private_key_path: /etc/action-dispatch/app.pem
  webhook_secret: change-me

pools:
  - name: default
    labels: [self-hosted, linux, x64]
    provider: gcp
    max_runners: 10
    idle_runners: 0
    gcp:
      project: my-project
      zone: us-central1-a
      machine_type: e2-standard-4
      # runner_image defaults to ghcr.io/actions/actions-runner:latest
      # Override with your own image for additional tools:
      # runner_image: ghcr.io/my-org/actions-runner:latest
      spot: true
      disk_size_gb: 50
      # network: projects/my-project/global/networks/my-vpc
      # subnet: projects/my-project/regions/us-central1/subnetworks/my-subnet
      # service_account: runner@my-project.iam.gserviceaccount.com
